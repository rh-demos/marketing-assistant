---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-admin-setup
  labels:
    app: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-admin-setup-edit
  labels:
    app: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: keycloak-admin-setup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-keycloak-admin-secret
  labels:
    app: keycloak
    app.kubernetes.io/part-of: keycloak
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: create-keycloak-admin-secret
        image: 'image-registry.openshift-image-registry.svc:5000/openshift/tools:latest'
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
        args:
          - -ec
          - |-
            if [ -n "$(oc get secret keycloak-admin -oname 2>/dev/null)" ]; then
              echo "Secret already exists. Skipping." >&2
              exit 0
            fi
            genpass() {
                < /dev/urandom tr -dc _A-Z-a-z-0-9 | head -c"${1:-32}"
            }
            password=$(genpass)
            cat << EOF | oc apply -f-
            apiVersion: v1
            kind: Secret
            metadata:
              name: keycloak-admin
            type: Opaque
            stringData:
              username: admin
              password: ${password}
            EOF
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      restartPolicy: Never
      serviceAccount: keycloak-admin-setup
      serviceAccountName: keycloak-admin-setup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      serviceAccountName: keycloak-admin-setup
      initContainers:
      - name: wait-for-admin-secret
        image: 'image-registry.openshift-image-registry.svc:5000/openshift/tools:latest'
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
        args:
          - -ec
          - |-
            echo -n 'Waiting for keycloak-admin secret'
            while ! oc get secret keycloak-admin 2>/dev/null | grep -qF keycloak-admin; do
              echo -n .
              sleep 5
            done; echo
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      containers:
      - name: keycloak
        image: 'quay.io/keycloak/keycloak:26.1'
        command:
          - /opt/keycloak/bin/kc.sh
        args:
          - start
          - --http-enabled=true
          - --proxy-headers=xforwarded
          - --hostname-strict=false
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
          - name: health
            containerPort: 9000
            protocol: TCP
        env:
          - name: KC_DB
            value: postgres
          - name: KC_DB_URL_HOST
            value: keycloak-postgresql-service
          - name: KC_DB_URL_PORT
            value: "5432"
          - name: KC_DB_URL_DATABASE
            valueFrom:
              secretKeyRef:
                name: keycloak-postgresql-secret
                key: database-name
          - name: KC_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: keycloak-postgresql-secret
                key: database-user
          - name: KC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-postgresql-secret
                key: database-password
          - name: KC_HOSTNAME
            value: "KC_HOSTNAME_PLACEHOLDER"
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_PROXY_HEADERS
            value: xforwarded
          - name: KC_HEALTH_ENABLED
            value: "true"
          - name: KC_METRICS_ENABLED
            value: "true"
          - name: KEYCLOAK_ADMIN
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: username
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: password
        startupProbe:
          httpGet:
            path: /health/started
            port: 9000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: "1536Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: keycloak-service
    weight: 100
  wildcardPolicy: None
