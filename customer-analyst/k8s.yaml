apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-analyst-config
  labels:
    app: customer-analyst
data:
  PORT: "8084"
  AGENT_ENDPOINT: "http://customer-analyst:8084"
  MONGODB_MCP_URL: "http://mongodb-mcp:8082"
  EVENT_HUB_URL: "http://event-hub:8080"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.mlflow.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.mlflow.svc.cluster.local:4318/v1/traces"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  MLFLOW_TRACKING_URI: "http://mlflow-service.mlflow.svc.cluster.local:5000"
  MLFLOW_EXPERIMENT_NAME: "marketing-assistant"
  OTEL_SERVICE_NAME: "customer-analyst"
  OTEL_METRICS_EXPORTER: "none"
---
apiVersion: v1
kind: Secret
metadata:
  name: customer-analyst-secrets
  labels:
    app: customer-analyst
type: Opaque
stringData:
  MODEL_ENDPOINT: "https://qwen3-32b-fp8-dynamic-predictor.models.svc.cluster.local:8443/v1"
  MODEL_NAME: "qwen3-32b-fp8-dynamic"
  MODEL_API_KEY: "<TODO>"
---
# Sandbox resource for customer-analyst (on-demand allocation)
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: customer-analyst
  labels:
    app: customer-analyst
    app.kubernetes.io/name: customer-analyst
    app.kubernetes.io/component: agent
spec:
  operatingMode: Running
  service: true
  shutdownPolicy: Retain
  podTemplate:
    metadata:
      labels:
        app: customer-analyst
    spec:
      runtimeClassName: kata
      serviceAccountName: customer-analyst
      containers:
      - name: customer-analyst
        image: quay.io/rh-demos/marketing-assistant/customer-analyst:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          protocol: TCP
        envFrom:
        - configMapRef:
            name: customer-analyst-config
        - secretRef:
            name: customer-analyst-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-analyst
