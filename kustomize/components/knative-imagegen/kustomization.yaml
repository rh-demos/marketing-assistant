apiVersion: kustomize.config.k8s.io/v1beta1
kind: Component

# Replace standard imagegen-mcp Deployment+Service with Knative Service.
# The k8s-knative.yaml already contains ConfigMap + Secret + Knative Service,
# so we remove the Deployment and ClusterIP Service from base and add the
# Knative variant.

patches:
  - target:
      kind: Deployment
      name: imagegen-mcp
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: imagegen-mcp
  - target:
      kind: Service
      name: imagegen-mcp
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: imagegen-mcp
  - target:
      kind: ConfigMap
      name: imagegen-mcp-config
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: imagegen-mcp-config
  - target:
      kind: Secret
      name: imagegen-mcp-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: imagegen-mcp-secrets

resources:
  - ../../../imagegen-mcp/k8s-knative.yaml
