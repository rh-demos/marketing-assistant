apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Replace imagegen-mcp Deployment+Service with Knative Service.
# - Deletes Deployment and ClusterIP Service from base
# - Removes PORT from ConfigMap (Knative injects PORT automatically)
# - The Knative Service is applied separately by kdeploy.sh (kustomize $patch:delete
#   cannot distinguish v1/Service from serving.knative.dev/v1/Service by name)

patches:
  - target:
      kind: Deployment
      name: imagegen-mcp
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: imagegen-mcp
  - target:
      kind: Service
      name: imagegen-mcp
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: imagegen-mcp
  - target:
      kind: ConfigMap
      name: imagegen-mcp-config
    patch: |-
      - op: remove
        path: /data/PORT
