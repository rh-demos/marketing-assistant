apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: imagegen-mcp
  labels:
    app: imagegen-mcp
    app.kubernetes.io/name: imagegen-mcp
    app.kubernetes.io/component: mcp
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/window: "60s"
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "60s"
    spec:
      timeoutSeconds: 240
      containerConcurrency: 3
      containers:
      - name: imagegen-mcp
        image: quay.io/rh-demos/marketing-assistant/imagegen-mcp:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http1
          protocol: TCP
        envFrom:
        - configMapRef:
            name: imagegen-mcp-config
        - secretRef:
            name: imagegen-mcp-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
