apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../mongodb/k8s.yaml
  - ../../config-service/k8s.yaml
  - ../../event-hub/k8s.yaml
  - ../../mongodb-mcp/k8s.yaml
  - ../../imagegen-mcp/k8s.yaml
  - ../../campaign-director/k8s.yaml
  - ../../creative-producer/k8s.yaml
  - ../../customer-analyst/k8s.yaml
  - ../../policy-guardian/k8s.yaml
  - ../../delivery-manager/k8s.yaml
  - ../../campaign-api/k8s.yaml
  - ../../frontend/k8s.yaml

configMapGenerator:
  - name: vertical-config
    files:
      - ../../config-service/app/verticals/hotel-casino.json
      - ../../config-service/app/verticals/banking.json
      - ../../config-service/app/verticals/retail-mall.json
      - ../../config-service/app/verticals/telco.json

generatorOptions:
  disableNameSuffixHash: true
